name: Build and Push Docker Image to Docker Registry

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build_and_push:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    env:
      DOCKER_REPOSITORY: 'victorysokolov/django-blog'
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_REPOSITORY }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          secrets: |
            SECRET_KEY=${{ env.SECRET_KEY }}
          build-args: |
            SECRET_KEY=${{ env.SECRET_KEY }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Docker Scout analysis
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: cves,recommendations,compare
          image: ${{ env.DOCKER_REPOSITORY }}:${{ github.sha }}
          to-latest: true
          ignore-base: true
          ignore-unchanged: true
          only-fixed: true
