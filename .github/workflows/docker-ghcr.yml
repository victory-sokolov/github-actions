name: Docker Build on GHCR

on:
    workflow_call:
        inputs:
            image_name:
                required: true
                type: string
            dockerfile_path:
                required: false
                type: string
                default: ./Dockerfile
            context:
                required: false
                type: string
                default: .
            build_args:
                required: false
                type: string
            target:
                required: false
                type: string
            tags:
                required: false
                type: string
                default: ''
            platforms:
                required: false
                type: string
                default: linux/amd64,linux/arm64

        secrets:
            registry_token:
                required: false

jobs:
    select-runner:
        runs-on: ubuntu-latest
        outputs:
            runner: ${{ steps.pick.outputs.runner }}
            needs_qemu: ${{ steps.pick.outputs.needs_qemu }}
        steps:
            - id: pick
              run: |
                  if [[ "${{ inputs.platforms }}" == *","* ]]; then
                      echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
                      echo "needs_qemu=true" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ inputs.platforms }}" == "linux/arm64" ]]; then
                      echo "runner=ubuntu-24.04-arm" >> "$GITHUB_OUTPUT"
                      echo "needs_qemu=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
                      echo "needs_qemu=false" >> "$GITHUB_OUTPUT"
                  fi

    build:
        needs: select-runner
        runs-on: ${{ needs.select-runner.outputs.runner }}
        timeout-minutes: 25
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up QEMU
              if: needs.select-runner.outputs.needs_qemu == 'true'
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Docker Buildx
              id: setup-buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  # Use the passed secret if available, otherwise fallback to GITHUB_TOKEN
                  password: ${{ secrets.registry_token || secrets.GITHUB_TOKEN }}

            - name: Prepare metadata config
              id: meta-config
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  INPUT_TAGS: ${{ inputs.tags }}
              with:
                  script: |
                      const tags = (process.env.INPUT_TAGS || '')
                        .split(/\r?\n/)
                        .map((tag) => tag.trim())
                        .filter(Boolean);

                      const isTag = context.refType === 'tag';
                      const isMain = context.refType === 'branch' && context.refName === 'main';

                      const metadataTags = tags.length > 0
                        ? tags.map((tag) => `type=raw,value=${tag}`)
                        : [
                            'type=sha,format=long,prefix=sha-',
                            `type=raw,value=latest,enable=${isMain || isTag}`,
                            `type=raw,value=${context.refName},enable=${isTag}`,
                          ];

                      core.setOutput('tags', metadataTags.join('\n'));

            - name: Compute tags
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
                  tags: ${{ steps.meta-config.outputs.tags }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}

            - name: Build and push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ${{ inputs.context }}
                  file: ${{ inputs.dockerfile_path }}
                  target: ${{ inputs.target }}
                  platforms: ${{ inputs.platforms }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: ${{ inputs.build_args }}
                  cache-from: |
                      type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:buildcache-${{ inputs.target || 'default' }}
                      type=gha,scope=${{ inputs.image_name }}-${{ inputs.target || 'default' }}
                  cache-to: |
                      type=gha,mode=max,scope=${{ inputs.image_name }}-${{ inputs.target || 'default' }}
