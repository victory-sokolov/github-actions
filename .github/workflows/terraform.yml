name: Terraform Quality Checks
on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.terraform.lock.hcl'
  workflow_call:
    inputs:
      terraform_version:
        description: 'Terraform version to use'
        required: false
        type: string
        default: 'latest'
      working_directory:
        description: 'Directory containing Terraform code'
        required: false
        type: string
        default: '.'
      skip_trivy:
        description: 'Skip Trivy security scan'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform-quality:
    name: Terraform Quality
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Create Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Cache Terraform plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint --init
        run: tflint --init
        working-directory: ${{ inputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: tflint
        run: tflint --recursive
        working-directory: ${{ inputs.working_directory }}
      - name: terraform fmt
        uses: dflook/terraform-fmt-check@b5d95a3c92f409e0e1cae4200cb7b6e1244d3182 # v3.1.2
        with:
          path: ${{ inputs.working_directory }}
      - name: terraform validate
        uses: dflook/terraform-validate@3577895932c19faa3b8df0e713de05870fc075d8 # v3.1.2
        with:
          path: ${{ inputs.working_directory }}
      - name: terraform plan
        uses: dflook/terraform-plan@738d3a75f0d801d280dca5eb7357b89c8383267f # v3.1.2
        with:
          path: ${{ inputs.working_directory }}

  trivy-scan:
    name: Trivy Security Scan
    needs: terraform-quality
    if: ${{ !inputs.skip_trivy }}
    uses: ./.github/workflows/trivy-scan.yml
    with:
      scan-type: 'config'
      upload-sarif: true
    secrets:
      github-token: ${{ secrets.github-token || github.token }}
