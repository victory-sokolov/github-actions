name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        default: '3.14'
        type: string
      uv-version:
        description: 'uv version to use'
        default: 'latest'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔤 Spell Check with Typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

      - name: 📄 Read .python-version if exists
        id: python-version
        run: |
          if [ -f .python-version ]; then
            echo "PYTHON_VERSION=$(cat .python-version)" >> "$GITHUB_OUTPUT"
          else
            echo "PYTHON_VERSION=${{ inputs.python-version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 🐍 Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python-version.outputs.PYTHON }}

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ inputs.uv-version }}

      - name: 📦 Setup UV cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .uv-cache
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ steps.python-version.outputs.PYTHON }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ steps.python-version.outputs.PYTHON }}-
            uv-${{ runner.os }}-

      - name: 📥 Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync
          elif [ -f pyproject.toml ]; then
            uv sync --no-dev
          elif [ -f requirements.txt ]; then
            uv pip install -r requirements.txt
          fi

      - name: 🔍 Run ruff linter
        run: uv run ruff check .
        continue-on-error: true

      - name: ✅ Run ruff formatter check
        run: uv run ruff format --check .

      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: latest

      - name: 🧪 Run tests with pytest
        run: uv run pytest --cov=. --cov-report=xml --cov-report=html
        continue-on-error: true

      - name: 📊 Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 📤 Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            .coverage
          retention-days: 7
          compression-level: 6
