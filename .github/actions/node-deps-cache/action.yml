name: Setup Dependencies with Cache
description: Detects package manager, sets it up with proper caching, and installs dependencies

inputs:
  package-manager:
    description: 'Package manager to use (auto, bun, pnpm, npm). Auto-detects if not specified.'
    required: false
    default: 'bun'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  bun-version:
    description: 'Bun version to use'
    required: false
    default: '1.3.12'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: 'latest'
  registry:
    description: 'Registry type (npm for public, github for GitHub Packages)'
    required: false
    default: 'npm'
  scope:
    description: 'Scope for GitHub Packages (e.g., @victory-sokolov)'
    required: false
    default: ''
  working-directory:
    description: 'Working directory'
    required: false
    default: '.'

outputs:
  package-manager:
    description: 'The detected/used package manager'
    value: ${{ steps.detect.outputs.package-manager }}

runs:
  using: composite
  steps:
    - name: Detect package manager
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "🔍 Detecting package manager..."
        if [ "${{ inputs.package-manager }}" != "auto" ]; then
          echo "package-manager=${{ inputs.package-manager }}" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Auto-detect based on lock files
        if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
          echo "package-manager=bun" >> $GITHUB_OUTPUT
        elif [ -f "pnpm-lock.yaml" ]; then
          echo "package-manager=pnpm" >> $GITHUB_OUTPUT
        elif [ -f "package-lock.json" ]; then
          echo "package-manager=npm" >> $GITHUB_OUTPUT
        else
          echo "package-manager=npm" >> $GITHUB_OUTPUT
          echo "::warning::No lock file found, defaulting to npm"
        fi

    - name: 🌿 Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.detect.outputs.package-manager != 'bun' && steps.detect.outputs.package-manager || '' }}
        cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.detect.outputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
        registry-url: ${{ inputs.registry == 'github' && 'https://npm.pkg.github.com' || '' }}
        scope: ${{ inputs.registry == 'github' && inputs.scope || '' }}

    - name: Node.js version
      shell: bash
      run: |
        echo "Using Node.js version: $(node --version)"

    - name: Setup pnpm
      if: steps.detect.outputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Bun
      if: steps.detect.outputs.package-manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun dependencies
      if: steps.detect.outputs.package-manager == 'bun'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory), format('{0}/bun.lockb', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: 🛡️ Socket firewall
      uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        PM="${{ steps.detect.outputs.package-manager }}"
        echo "📦 Installing dependencies using $PM..."

        echo "Node.js version: $(node --version 2>/dev/null || echo 'Not available')"

        case "$PM" in
          bun)
            sfw bun ci --ignore-scripts
            ;;
          pnpm)
            sfw pnpm install --frozen-lockfile --ignore-scripts
            ;;
          npm)
            sfw npm ci --ignore-scripts
            ;;
        esac
